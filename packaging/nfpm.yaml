# nfpm config — built by packaging/build.sh (make packages)
name: dockera
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: ${MAINTAINER}
description: |
  Agentless Docker management: CRM-style web UI, compose stacks,
  marketplace, terminal and live logs. Sign-in with system users (PAM)
  and roles by POSIX groups.
vendor: dockera

depends:
  - libpam0g
overrides:
  rpm:
    depends:
      - pam
      # any Docker-compatible engine; how dockera reaches it is detected at install (dockera setup)
      - (docker-ce or moby-engine or docker or docker-ee or podman-docker)
    recommends:
      - (docker-compose-plugin or docker-compose)
      - openssh-clients
  deb:
    depends:
      - libpam0g
      - docker-ce | docker.io | moby-engine | docker-engine | docker-ee
    recommends:
      - docker-compose-plugin | docker-compose-v2
      - openssh-client

contents:
  - src: ./dist/build/dockera-linux-${ARCH}
    dst: /usr/bin/dockera
    file_info: { mode: 0755 }
  - src: ./packaging/systemd/dockera.service
    dst: /usr/lib/systemd/system/dockera.service
  - src: ./packaging/systemd/dockera-pam.socket
    dst: /usr/lib/systemd/system/dockera-pam.socket
  - src: ./packaging/systemd/dockera-pam@.service
    dst: /usr/lib/systemd/system/dockera-pam@.service
  - src: ./packaging/dockera.env
    dst: /etc/dockera/dockera.env
    type: config|noreplace
  - src: ./packaging/pam/dockera.redhat
    dst: /etc/pam.d/dockera
    type: config|noreplace
    packager: rpm
  - src: ./packaging/pam/dockera.debian
    dst: /etc/pam.d/dockera
    type: config|noreplace
    packager: deb

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
