name: Release

# Push a tag like v0.2.0 (or 0.2.0): builds the rpm/deb packages (amd64,
# arm64, with PAM) and the static binaries, and attaches them to the GitHub
# release. Run it by hand with a tag to (re)build an existing release.
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to
        required: true

permissions:
  contents: write
  actions: write # to rebuild the site with the new release

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Web UI
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Tests
        run: go test ./...
      - name: rpm + deb
        run: make packages PKG_VERSION="${TAG#v}"
      - name: Static binaries
        run: make dist VERSION="$TAG"
      - name: Checksums
        run: |
          cp dist/packages/* dist/
          cd dist && sha256sum ducktainer-*.rpm ducktainer_*.deb ducktainer-linux-* ducktainer-darwin-* ducktainer-windows-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/*.rpm dist/*.deb dist/ducktainer-linux-* dist/ducktainer-darwin-* dist/ducktainer-windows-* dist/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "ducktainer ${TAG#v}" --generate-notes --verify-tag
          fi
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        # releases made with GITHUB_TOKEN do not trigger other workflows
        run: gh workflow run pages.yml --ref main
